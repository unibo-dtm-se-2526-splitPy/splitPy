[project]
name = "splitpy-core"
# Placeholder: the released version is the core-v* git tag computed by semantic-release,
# stamped here only at build time (main is PR-only, so CI never commits a version bump).
version = "0.0.0"
description = "Domain library for shared expense management: money arithmetic, split strategies, balances and settlement."
authors = [
    { name = "Lorenzo Fattori", email = "lorenzo.fattori2@studio.unibo.it" },
    { name = "Alessandro Grotti", email = "alessandro.grotti@studio.unibo.it" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = []

[tool.poetry]
packages = [{ include = "splitpy_core" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=splitpy_core --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["splitpy_core"]

[tool.black]
line-length = 100

[tool.semantic_release]
tag_format = "core-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional-monorepo"
# 0.x until the domain API is stable: breaking changes bump the minor, 1.0.0 is a deliberate release.
allow_zero_version = true
major_on_zero = false
build_command = "poetry build"

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[tool.semantic_release.branches.main]
match = "^main$"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.165.2,<7.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "black (>=26.5.1,<27.0.0)"
]
