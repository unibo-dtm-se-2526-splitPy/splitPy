[project]
name = "splitpy-app"
version = "0.1.0"
description = "Application layer and adapters for splitPy: use cases, REST API, persistence."
authors = [
    { name = "Lorenzo Fattori", email = "lorenzo.fattori2@studio.unibo.it" },
    { name = "Alessandro Grotti", email = "alessandro.grotti@studio.unibo.it" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["splitpy-core"]

[tool.poetry]
packages = [{ include = "splitpy_app" }]

[tool.poetry.dependencies]
splitpy-core = { path = "../splitpy-core", develop = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=splitpy_app --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["splitpy_app", "splitpy_core"]

[tool.black]
line-length = 100

# Hexagonal boundaries, checked in CI with `lint-imports`.
[tool.importlinter]
root_package = "splitpy_app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The application layer depends on no framework and not on the adapters"
type = "forbidden"
source_modules = ["splitpy_app.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "splitpy_app.adapters"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "import-linter (>=2.15,<3.0)"
]
